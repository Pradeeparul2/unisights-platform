name: Build and Publish NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install dependencies
        run: npm install
        working-directory: client-sdk

      - name: Build Rust WASM
        run: cd core && wasm-pack build --target web --release
        working-directory: client-sdk

      - name: Build JS bundle
        run: node build.mjs
        working-directory: client-sdk
        env:
          INSIGHTS_ENDPOINT: ${{ secrets.INSIGHTS_ENDPOINT }}
          INSIGHTS_SECRET: ${{ secrets.INSIGHTS_SECRET }}
          INSIGHTS_SALT: ${{ secrets.INSIGHTS_SALT }}
          INSIGHTS_DEBUG: false

      - name: Copy wasm pkg
        run: |
          mkdir -p dist
          cp -r core/pkg dist/
          rm -f dist/pkg/package.json  # remove nested package.json
        working-directory: client-sdk

      - name: Debug npm pack
        run: |
          cat package.json
          echo "--- checking for ignore files ---"
          ls -la
          cat .gitignore || echo "no .gitignore"
          echo "--- wasm file check ---"
          file dist/pkg/unisights_core_bg.wasm
          ls -la dist/pkg/
        working-directory: client-sdk

      - name: Check dist contents
        run: |
          ls -R dist
        working-directory: client-sdk

      - name: Dry run pack
        run: npm pack --dry-run
        working-directory: client-sdk

      - name: Publish to NPM
        run: npm publish --access public
        working-directory: client-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

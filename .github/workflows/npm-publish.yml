name: Build and Publish NPM

on:
  push:
    branches:
      # - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
          cache-dependency-path: client-sdk/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: client-sdk/core/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Cache wasm-pack binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: which wasm-pack || cargo install wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client-sdk

      - name: Build Rust WASM
        run: cd core && wasm-pack build --target web --release
        working-directory: client-sdk

      - name: Build JS bundle
        run: node build.mjs
        working-directory: client-sdk
        env:
          INSIGHTS_ENDPOINT: ${{ secrets.INSIGHTS_ENDPOINT }}
          INSIGHTS_SECRET: ${{ secrets.INSIGHTS_SECRET }}
          INSIGHTS_SALT: ${{ secrets.INSIGHTS_SALT }}
          INSIGHTS_DEBUG: false

      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks
        working-directory: client-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

[package]
name = "unisights_core"
version = "0.1.0"
edition = "2021"
description = "WebAssembly analytics module for tracking clicks and scrolls"
repository = "https://github.com/your-repo/wasm-analytics" # Optional
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.93" # Downgrade to test compatibility
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.5"
js-sys = "0.3"
base64 = "0.21"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
generic-array = "0.14"
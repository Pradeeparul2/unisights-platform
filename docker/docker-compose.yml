name: unisights
x-env-file: &env_file
  - .env

volumes:
  metadata_data: {} # For Druid PostgreSQL
  druid_var: {} # For Druid services
  minio-data: {} # For Minio deep storage
  db_data: {} # For Superset PostgreSQL
  superset_home: {} # For Superset home directory

services:
  # Client SDK
  sdk-service:
    container_name: unisights-sdk
    build:
      context: ../client-sdk
      dockerfile: Dockerfile
      args:
        INSIGHTS_ENDPOINT: ${INSIGHTS_ENDPOINT}
        INSIGHTS_SECRET: ${INSIGHTS_SECRET}
        INSIGHTS_SALT: ${INSIGHTS_SALT}
        INSIGHTS_DEBUG: ${INSIGHTS_DEBUG}
        INSIGHTS_GEO_API: ${INSIGHTS_GEO_API}
    env_file: *env_file
    ports:
      - "9005:9005"
    command: ["serve", "-s", "dist", "-l", "9005", "--cors"]
    depends_on:
      ingestion-service:
        condition: service_healthy
    networks:
      - unisights-network

  # Kafka with KRaft
  kafka:
    image: docker.io/bitnami/kafka:4.0
    container_name: kafka
    env_file: *env_file
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=${KAFKA_NODE_ID:-0}
      - KAFKA_CFG_PROCESS_ROLES=${KAFKA_PROCESS_ROLES:-broker,controller}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${KAFKA_CONTROLLER_QUORUM_VOTERS:-0@kafka:9093}
      # Listeners
      - KAFKA_CFG_LISTENERS=${KAFKA_LISTENERS}
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_ADVERTISED_LISTENERS}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
    healthcheck:
      test:
        ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - unisights-network

  # Kafka UI(Optional)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    profiles: ["ingestion"]
    ports:
      - "9003:9003"
    env_file: *env_file
    environment:
      KAFKA_BROKERCONNECT: ${KFFDROP_KAFKA_BROKERCONNECT:-kafka:9092}
      SERVER_PORT: ${KFFDROP_SERVER_PORT:-9003}
      JVM_OPTS: ${KFFDROP_JVM_OPTS:-"-Xms32m -Xmx64m"}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - unisights-network

  # Ingestion Service
  ingestion-service:
    container_name: ingestion-service
    build:
      context: ../ingestion-service
      dockerfile: Dockerfile
    env_file: *env_file
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKERS: ${INGESTION_KAFKA_BROKERS:-kafka:9092}
      GEOIP_DB_PATH: /app/geo/GeoLite2-City.mmdb
      PORT: ${INGESTION_SERVICE_PORT:-8000}
      ENCRYPTION_PASSPHRASE: ${INSIGHTS_SECRET}
      ENCRYPTION_SALT: ${INSIGHTS_SALT}
      EVENT_TOPIC: ${INGESTION_EVENT_TOPIC:-events-stream}
      SESSION_TOPIC: ${INGESTION_SESSION_TOPIC:-sessions-stream}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://ingestion-service:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - unisights-network

  postgres:
    container_name: postgres
    image: postgres:16 # Using latest version from Superset for compatibility
    ports:
      - "5432:5432"
    env_file: *env_file
    volumes:
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - metadata_data:/var/lib/postgresql/data # Shared volume
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-FoolishPassword} # Root password for PostgreSQL
      - POSTGRES_USER=${POSTGRES_USER:-postgres} # Default superuser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisights-network

  zookeeper:
    container_name: zookeeper
    image: zookeeper:3.5.10
    ports:
      - "2181:2181"
    env_file: *env_file
    environment:
      - ZOO_MY_ID=${DRUID_ZOOKEEPER_ID:-1}
      - ZOO_4LW_COMMANDS_WHITELIST=ruok,stat
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisights-network

  coordinator:
    image: apache/druid:33.0.0
    container_name: coordinator
    volumes:
      - druid_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    command:
      - coordinator
    env_file:
      - druid/environment
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo 'Health check' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unisights-network

  broker:
    image: apache/druid:33.0.0
    container_name: broker
    volumes:
      - druid_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8082:8082"
    command:
      - broker
    env_file:
      - druid/environment
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo 'Health check' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unisights-network

  historical:
    image: apache/druid:33.0.0
    container_name: historical
    volumes:
      - druid_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8083:8083"
    command:
      - historical
    env_file:
      - druid/environment
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo 'Health check' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unisights-network

  middlemanager:
    image: apache/druid:33.0.0
    container_name: middlemanager
    volumes:
      - druid_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8091:8091"
    command:
      - middleManager
    env_file:
      - druid/environment
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo 'Health check' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    networks:
      - unisights-network

  router:
    image: apache/druid:33.0.0
    container_name: router
    volumes:
      - druid_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8888:8888"
    command:
      - router
    env_file:
      - druid/environment
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo 'Health check' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unisights-network

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    env_file: *env_file
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl -f http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - unisights-network

  supervisor-deployer:
    image: curlimages/curl
    container_name: supervisor-deployer
    user: root
    volumes:
      - ./druid/supervisor_specs:/supervisor_specs
      - ./druid/submit_supervisor_specs.sh:/submit_supervisor_specs.sh
    command: ["sh", "/submit_supervisor_specs.sh"]
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - unisights-network

  # Flink will be enabled in the future if needed
  # flink-jobmanager:
  #   build:
  #     context: ./flink
  #     dockerfile: Dockerfile.flink
  #   container_name: flink-jobmanager
  #   ports:
  #     - "8089:8081"
  #   command: jobmanager
  #   volumes:
  #     - ./flink/session_aggregator.py:/opt/flink/jobs/session_aggregator.py
  #   environment:
  #     - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8081"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   networks:
  #     - unisights-network

  # flink-taskmanager:
  #   build:
  #     context: ./flink
  #     dockerfile: Dockerfile.flink
  #   container_name: flink-taskmanager
  #   depends_on:
  #     flink-jobmanager:
  #       condition: service_healthy
  #   command: taskmanager
  #   environment:
  #     - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
  #   networks:
  #     - unisights-network
  # flink-submitter:
  #   build:
  #     context: ./flink
  #     dockerfile: Dockerfile.flink
  #   container_name: flink-submitter
  #   depends_on:
  #     flink-jobmanager:
  #       condition: service_healthy
  #   command: >
  #     bash -c "sleep 10 && /opt/flink/bin/flink run -py /opt/flink/jobs/session_aggregator.py && tail -f /dev/null"
  #   networks:
  #     - unisights-network
  #   # volumes:
  #   #   - ./flink/jobs:/opt/flink/jobs
  #   environment:
  #     - FLINK_HOME=/opt/flink
  #     - PYTHONPATH=/opt/flink/jobs
  #     - "FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager"

  superset:
    image: apache/superset:latest
    container_name: superset_app
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-FoolishSecretKey}
      - DATABASE_DB=${SUPERSET_DB}
      - DATABASE_HOST=${SUPERSET_DB_HOST}
      - DATABASE_PORT=${SUPERSET_DB_PORT}
      - DATABASE_USER=${SUPERSET_DB_USER}
      - DATABASE_PASSWORD=${SUPERSET_DB_PASSWORD}
      - DATABASE_DIALECT=${SUPERSET_DB_DIALECT}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
      - ./superset/init-superset.sh:/app/init-superset.sh
      - ./superset/main_dashboard.zip:/app/main_dashboard.zip
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "/app/init-superset.sh"
    networks:
      - unisights-network

networks:
  unisights-network:
    driver: bridge

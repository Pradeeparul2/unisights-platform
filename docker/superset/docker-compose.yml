version: "3.8"

services:
  db:
    image: postgres:16
    container_name: superset_db
    environment:
      - POSTGRES_DB=superset
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superset-net

  superset:
    image: apache/superset:latest
    container_name: superset_app
    environment:
      - SUPERSET_SECRET_KEY=CHANGE_ME_TO_A_SECURE_RANDOM_KEY
      - DATABASE_DB=superset
      - DATABASE_HOST=db
      - DATABASE_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD
      - DATABASE_USER=superset
      - DATABASE_PORT=5432
      - DATABASE_DIALECT=postgresql
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        pip install pydruid pillow setuptools<81 &&
        superset db upgrade &&
        superset init &&
        gunicorn -w 4 --timeout 120 -b 0.0.0.0:8088 'superset.app:create_app()'
      "
    networks:
      - superset-net

volumes:
  db_data:
  superset_home:

networks:
  superset-net:
    driver: bridge

{{- range $roleName, $role := .Values.druid.roles }}
---
apiVersion: v1
kind: Service
metadata:
  name: unisights-druid-{{ $roleName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" (printf "druid-%s" $roleName) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: druid-{{ $roleName }}
  ports:
    - port: {{ $role.port }}
      targetPort: {{ $role.port }}
---
{{- if $role.persistent }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unisights-druid-{{ $roleName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" (printf "druid-%s" $roleName) | nindent 4 }}
spec:
  serviceName: unisights-druid-{{ $roleName }}
  replicas: {{ $role.replicas }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unisights-druid-{{ $roleName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" (printf "druid-%s" $roleName) | nindent 4 }}
spec:
  replicas: {{ $role.replicas }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: druid-{{ $roleName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: druid-{{ $roleName }}
      annotations:
        checksum/druid-config: {{ printf "%s:%s" ($.Values.druid | toJson) $.Values.postgres.user | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z unisights-zookeeper 2181; do echo waiting for zookeeper; sleep 3; done
              until nc -z unisights-postgres 5432; do echo waiting for postgres; sleep 3; done
              {{- if ne $roleName "coordinator" }}
              until nc -z unisights-druid-coordinator {{ (index $.Values.druid.roles "coordinator").port }}; do echo waiting for coordinator; sleep 3; done
              {{- end }}
      containers:
        - name: druid-{{ $roleName }}
          image: {{ $.Values.druid.image }}
          args: ["{{ $role.command }}"]
          ports:
            - containerPort: {{ $role.port }}
          envFrom:
            - configMapRef:
                name: unisights-druid-env
          env:
            - name: druid_host
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: druid_metadata_storage_connector_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: druid_s3_accessKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" $ }}
                  key: MINIO_ROOT_USER
            - name: druid_s3_secretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" $ }}
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            tcpSocket:
              port: {{ $role.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: {{ $role.port }}
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml $role.resources | nindent 12 }}
          volumeMounts:
            - name: druid-var
              mountPath: /opt/druid/var
{{- if $role.persistent }}
  volumeClaimTemplates:
    - metadata:
        name: druid-var
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $.Values.storageClass }}
        storageClassName: {{ $.Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $role.storageSize }}
{{- else }}
      volumes:
        - name: druid-var
          emptyDir: {}
{{- end }}
{{- end }}

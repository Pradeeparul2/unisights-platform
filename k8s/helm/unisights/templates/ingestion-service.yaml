apiVersion: v1
kind: Service
metadata:
  name: unisights-ingestion-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "ingestion-service" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ingestion-service
  ports:
    - port: {{ .Values.ingestionService.port }}
      targetPort: {{ .Values.ingestionService.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unisights-ingestion-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "ingestion-service" | nindent 4 }}
spec:
  replicas: {{ .Values.ingestionService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z unisights-kafka 9092; do echo waiting for kafka; sleep 3; done"]
      containers:
        - name: ingestion-service
          image: "{{ .Values.ingestionService.image.repository }}:{{ .Values.ingestionService.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ingestionService.port }}
          envFrom:
            - configMapRef:
                name: unisights-ingestion-env
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ingestionService.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ingestionService.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ingestionService.resources | nindent 12 }}
{{- if .Values.ingestionService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unisights-ingestion-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "ingestion-service" | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unisights-ingestion-service
  minReplicas: {{ .Values.ingestionService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ingestionService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ingestionService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

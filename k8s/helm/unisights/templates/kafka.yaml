apiVersion: v1
kind: Service
metadata:
  name: unisights-kafka-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "kafka" | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: unisights-kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "kafka" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unisights-kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "kafka" | nindent 4 }}
spec:
  serviceName: unisights-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.nodeId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: {{ .Values.kafka.processRoles | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ .Values.kafka.controllerQuorumVoters | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_LISTENERS
              value: {{ .Values.kafka.listeners | quote }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ .Values.kafka.advertisedListeners | quote }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kafka.listenerSecurityProtocolMap | quote }}
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: {{ .Values.kafka.controllerListenerNames | quote }}
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: {{ .Values.kafka.interBrokerListenerName | quote }}
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
{{- if .Values.kafdrop.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: unisights-kafdrop
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "kafdrop" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafdrop
  ports:
    - port: {{ .Values.kafdrop.serverPort }}
      targetPort: {{ .Values.kafdrop.serverPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unisights-kafdrop
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "kafdrop" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafdrop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: {{ .Values.kafdrop.image }}
          ports:
            - containerPort: {{ .Values.kafdrop.serverPort }}
          env:
            - name: KAFKA_BROKERCONNECT
              value: "unisights-kafka:9092"
            - name: SERVER_PORT
              value: {{ .Values.kafdrop.serverPort | quote }}
            - name: JVM_OPTS
              value: {{ .Values.kafdrop.jvmOpts | quote }}
          resources:
            {{- toYaml .Values.kafdrop.resources | nindent 12 }}
{{- end }}

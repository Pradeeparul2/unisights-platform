apiVersion: v1
kind: Service
metadata:
  name: unisights-superset
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "superset" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: superset
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unisights-superset
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "superset" | nindent 4 }}
spec:
  serviceName: unisights-superset
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z unisights-postgres 5432; do echo waiting for postgres; sleep 3; done
              until nc -z unisights-druid-coordinator {{ (index .Values.druid.roles "coordinator").port }}; do echo waiting for coordinator; sleep 3; done
              until nc -z unisights-druid-broker {{ (index .Values.druid.roles "broker").port }}; do echo waiting for broker; sleep 3; done
      containers:
        - name: superset
          image: {{ .Values.superset.image }}
          command: ["/bin/sh", "/app/init-superset.sh"]
          ports:
            - containerPort: 8088
          env:
            - name: SUPERSET_CONFIG_PATH
              value: "/app/pythonpath/superset_config.py"
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" . }}
                  key: SUPERSET_SECRET_KEY
            - name: DATABASE_DB
              value: "superset"
            - name: DATABASE_HOST
              value: "unisights-postgres"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" . }}
                  key: SUPERSET_DB_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" . }}
                  key: SUPERSET_DB_PASSWORD
            - name: DATABASE_DIALECT
              value: "postgresql"
            - name: SUPERSET_ADMIN_USERNAME
              value: {{ .Values.superset.admin.username | quote }}
            - name: SUPERSET_ADMIN_EMAIL
              value: {{ .Values.superset.admin.email | quote }}
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "unisights.secretName" . }}
                  key: SUPERSET_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.superset.resources | nindent 12 }}
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home
            - name: init-script
              mountPath: /app/init-superset.sh
              subPath: init-superset.sh
            - name: superset-config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
{{- if .Values.superset.dashboard.enabled }}
            - name: dashboard
              mountPath: /app/main_dashboard.zip
              subPath: main_dashboard.zip
{{- end }}
      volumes:
        - name: init-script
          configMap:
            name: unisights-superset-init
            defaultMode: 0755
        - name: superset-config
          configMap:
            name: unisights-superset-config
{{- if .Values.superset.dashboard.enabled }}
        - name: dashboard
          configMap:
            name: unisights-superset-dashboard
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: superset-home
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.superset.storage.size }}

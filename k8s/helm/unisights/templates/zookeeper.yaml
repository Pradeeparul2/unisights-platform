apiVersion: v1
kind: Service
metadata:
  name: unisights-zookeeper
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "zookeeper" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unisights-zookeeper
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unisights.componentLabels" "zookeeper" | nindent 4 }}
spec:
  serviceName: unisights-zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: {{ .Values.zookeeper.image }}
          ports:
            - containerPort: 2181
          env:
            - name: ZOO_MY_ID
              value: {{ .Values.zookeeper.myId | quote }}
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "ruok,stat"
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.zookeeper.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.zookeeper.storage.size }}
